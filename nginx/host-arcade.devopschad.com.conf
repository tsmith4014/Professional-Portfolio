# Host reverse proxy for arcade.devopschad.com (deployed by GitHub Actions or manual copy).
# Install: sudo apt install nginx certbot python3-certbot-nginx
# Cert once: sudo certbot --nginx -d arcade.devopschad.com
# Then copy this file to /etc/nginx/sites-available/ and enable (see DEPLOY.md).

server {
    listen 80;
    listen [::]:80;
    server_name arcade.devopschad.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After running certbot, it will add a server { listen 443 ssl; ... } block for HTTPS.
# If you manage SSL yourself, add a similar block with ssl_certificate and proxy_pass as above.
