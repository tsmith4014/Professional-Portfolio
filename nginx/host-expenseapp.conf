# =====================================================================
# Host nginx config: devopschad.com (main site) + expenseapp.devopschad.com
# Deployed by GitHub Actions so 127.0.0.1 proxy survives container restarts.
# =====================================================================
# ACME and HTTP Redirect Handler (MUST BE FIRST)
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name devopschad.com www.devopschad.com expenseapp.devopschad.com;

    # Serve Let's Encrypt ACME challenge files
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        default_type "text/plain";
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =====================================================================
# Default server block for HTTP (catch-all)
# =====================================================================
server {
    listen 80 default_server;          # Catch-all IPv4
    listen [::]:80 default_server;     # Catch-all IPv6
    server_name _;
    return 444;                        # Drop unmatched HTTP traffic
}

# =====================================================================
# Default server block for HTTPS (catch-all)
# =====================================================================
server {
    listen 443 ssl default_server;     # Catch-all IPv4
    listen [::]:443 ssl default_server;# Catch-all IPv6
    server_name _;

    ssl_certificate /etc/letsencrypt/live/devopschad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devopschad.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 444;                        # Drop unmatched HTTPS traffic
}

# =====================================================================
# expenseapp.devopschad.com (HTTPS)
# =====================================================================
server {
    listen 443 ssl;
    server_name expenseapp.devopschad.com;

    ssl_certificate /etc/letsencrypt/live/devopschad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devopschad.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/expenseapp.access.log;
    error_log /var/log/nginx/expenseapp.error.log;

    # Proxy API requests
    location /api/ {
        proxy_pass http://172.17.0.2:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy all other routes
    location / {
        proxy_pass http://172.17.0.2:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ACME challenge location (redundant safeguard)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        default_type "text/plain";
    }
}

# =====================================================================
# devopschad.com and www.devopschad.com (HTTPS) -> career frontend/API on host
# =====================================================================
server {
    listen 443 ssl;
    server_name devopschad.com www.devopschad.com;

    ssl_certificate /etc/letsencrypt/live/devopschad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devopschad.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/devopschad.access.log;
    error_log /var/log/nginx/devopschad.error.log;

    # Proxy API requests (career backend on host port 8001)
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy all other routes (career frontend on host port 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ACME challenge location (redundant safeguard)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        default_type "text/plain";
    }
}
