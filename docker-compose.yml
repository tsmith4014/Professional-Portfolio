# Dev stack: backend (FastAPI) + frontend (Vite). Mac-friendly; use buildx for linux/amd64 images to push.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    volumes:
      # Mount .env so the app can load it (backup if env_file doesn't inject)
      - ./backend/.env:/app/.env:ro

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - API_PROXY_TARGET=http://backend:8001
    depends_on:
      - backend
